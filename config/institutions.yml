schema_version: 2

# These are MONITOR editorial cohorts, not official CNBV classifications.
# Membership is curated explicitly; it is never inferred from an institution name.
cohorts:
  - code: traditional_bank
    label: Traditional bank
    definition: Established branch-led or universal banca multiple institution.
    lifecycle: active
  - code: digital_bank
    label: Digital-first bank
    definition: Banca multiple institution with a primarily digital operating model.
    lifecycle: active
  - code: niche_bank
    label: Niche bank
    definition: Specialized banca multiple institution outside the primary traditional/digital split.
    lifecycle: active

# Institution identities and registrations remain empty until curated source evidence exists.
institutions: []
