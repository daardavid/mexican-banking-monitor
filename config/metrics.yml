schema_version: 2

metrics:
  - code: loans_to_deposits
    definition_version: 1
    label: Loans to deposits
    lifecycle: draft
    # Symbolic only in PR9. Python registry/execution validation belongs to PR22/PR23.
    implementation_key: loans_to_deposits
    inputs:
      - role: numerator
        canonical_concept_code: gross_loans
        reporting_scope_code: individual_legal_entity
      - role: denominator
        canonical_concept_code: traditional_deposits
        reporting_scope_code: individual_legal_entity
    reporting_scope_rule: exact
    output:
      unit_code: ratio
      display_format: percent
      display_decimal_places: 2
    frequency: monthly
    rounding:
      mode: ROUND_HALF_EVEN
      calculation_decimal_places: 18
    methodology_description: Divide gross loans by traditional deposits for the same entity, period, scope, currency, and compatible units.
