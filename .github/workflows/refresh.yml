name: Refresh CNBV data

on:
  schedule:
    # CNBV releases are irregular. A cheap weekday poll detects new or revised files.
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
    inputs:
      period:
        description: "Optional YYYY-MM backfill period"
        required: false
        type: string

concurrency:
  group: cnbv-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    env:
      MBM_ENV: production
      MBM_DATABASE_URL: ${{ secrets.MBM_DATABASE_URL }}
      MBM_SUPABASE_URL: ${{ secrets.MBM_SUPABASE_URL }}
      MBM_SUPABASE_SECRET_KEY: ${{ secrets.MBM_SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - run: uv sync --locked
      - run: uv run mbm doctor --database

      # Enabled after the source-format spike produces a validated parser.
      # Keeping this explicit prevents a placeholder job from publishing bad data.
      # - run: uv run mbm refresh --period "${{ inputs.period }}"
