name: Provision artifact storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  main-guard:
    name: Require main branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production artifact Storage may only be provisioned from main." >&2
            exit 1
          fi

  provision:
    name: Provision production artifact Storage
    needs: main-guard
    runs-on: ubuntu-latest
    environment: production
    env:
      NO_COLOR: "1"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.115.0"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Synchronize declared Storage buckets
        run: supabase seed buckets --linked
