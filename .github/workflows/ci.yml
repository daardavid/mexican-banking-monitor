name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12.14"
          enable-cache: true

      - run: uv sync --locked --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --cov=mx_bank_monitor --cov-report=term-missing
      - run: uv run --no-sync mbm validate-config

  migration-validation:
    name: Supabase migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.115.0"

      - name: Start local database
        run: supabase db start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint migrated database
        run: supabase db lint --local --level error --fail-on error

      - name: Smoke-test migrated schema
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host=127.0.0.1
          --port=54322
          --username=postgres
          --dbname=postgres
          --no-password
          --set=ON_ERROR_STOP=1
          --file=supabase/tests/migration_smoke.sql

      - name: Stop local database
        if: ${{ always() }}
        continue-on-error: true
        run: supabase stop --no-backup --project-id mexican-banking-monitor

  powershell:
    name: PowerShell regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12.14"
          enable-cache: true

      - name: Run PowerShell command regression
        shell: pwsh
        run: .\scripts\test-common.ps1

      - name: Run PowerShell update regression
        shell: pwsh
        run: .\scripts\test-update.ps1

      - name: Run full PowerShell checks
        shell: pwsh
        run: .\scripts\check.ps1
